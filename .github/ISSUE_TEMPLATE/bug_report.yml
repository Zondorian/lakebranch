name: Bug report
description: Report a reproducible bug in Lakebranch
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Before you begin, search existing issues to avoid duplicates.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version
      placeholder: "e.g. Windows 11, Python 3.11"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lakebranch version / commit
      description: Output of `git rev-parse HEAD` or the version from `pyproject.toml`
      placeholder: "e.g. 0.1.0 or abc1234"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. Include the exact commands you ran.
      placeholder: |
        1. docker compose -f docker/docker-compose.yml --env-file .env up -d
        2. lakebranch init-demo
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including the full error message / trace
    validations:
      required: true
  - type: textarea
    id: services
    attributes:
      label: Docker services
      description: Output of `docker compose -f docker/docker-compose.yml ps`
      render: shell