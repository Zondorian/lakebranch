# =============================================================================
# Lakebranch — Airflow Orchestration Profile (Optional)
# =============================================================================
# Airflow is a swappable external execution layer — NOT embedded in the
# Lakebranch core. This standalone Airflow 2.x stack runs the demo DAG found in
# docker/airflow/dags/lakebranch_demo_dag.py.
#
# The project root (../ relative to this docker/ directory) is bind-mounted
# at /opt/lakebranch so Airflow workers can `from src.lakebranch.* import ...`
# exactly like the CLI pipeline.
#
# Usage:
#   docker compose -f docker/docker-compose.airflow.yml up -d --build
#   open http://localhost:8080   (admin / admin)
#
# This compose file is self-contained: it brings up its own Postgres + Redis.
# The Lakebranch data-plane (SeaweedFS + Nessie) is a separate stack — start it
# with docker/docker-compose.yml if the DAG needs to talk to the local cluster.
# =============================================================================

x-airflow-common: &airflow-common
  build: ./airflow
  image: lakebranch-airflow:2.10.5
  environment: &airflow-common-env
    # --- Airflow core configuration ---
    # CeleryExecutor is required: the celery CLI group (airflow celery worker)
    # is only registered when a Celery-based executor is configured. The
    # executor is backed by the Postgres metadata DB below (SQLite is not
    # compatible with CeleryExecutor).
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/lakebranch/docker/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
    # --- Airflow DB / broker ---
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    # --- Lakebranch environment ---
    # Profile, warehouse, and S3 credentials are passed through from .env.
    # NESSIE_URI / S3_ENDPOINT intentionally use host.docker.internal (not
    # localhost) because the Lakebranch data plane (Nessie + SeaweedFS) runs on
    # the host machine — inside a container, localhost refers to the container
    # itself, not the host.
    STORAGE_PROFILE: ${STORAGE_PROFILE:-seaweedfs}
    NESSIE_URI: http://host.docker.internal:19120/iceberg/main
    WAREHOUSE: ${WAREHOUSE:-warehouse}
    S3_ENDPOINT: http://host.docker.internal:9000
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    S3_BUCKET: ${S3_BUCKET:-warehouse}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
  volumes:
    # Bind-mount the Lakebranch project root (../ relative to docker/) so DAGs
    # can import src.lakebranch with the project-wide `from src.lakebranch.*`
    # convention. PYTHONPATH=/opt/lakebranch is set in the Dockerfile.
    - ../:/opt/lakebranch
  extra_hosts:
    # host.docker.internal is built-in on Docker Desktop (Windows/macOS); the
    # host-gateway entry makes it work on Linux Docker Engine too.
    - "host.docker.internal:host-gateway"
  networks:
    - lakebranch-airflow-net
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Infrastructure: Postgres (Airflow metadata DB) + Redis (Celery broker)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakebranch-airflow-net

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakebranch-airflow-net

  # ---------------------------------------------------------------------------
  # One-off init: migrate the metadata DB and create the admin user
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        (airflow users list -o json 2>/dev/null | grep -q '"username": "admin"' || \
          airflow users create \
            --username admin \
            --firstname Lakebranch \
            --lastname Admin \
            --role Admin \
            --email admin@example.com \
            --password admin)
    environment:
      <<: *airflow-common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow components
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $$HOSTNAME"]
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - "celery --app airflow.executors.celery_executor.app inspect ping -d celery@$$HOSTNAME"
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  lakebranch-airflow-net:
    name: lakebranch-airflow-net

volumes:
  postgres-db-volume: